name: Build RIFE libmpv (arm64)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish/update the rife-libmpv-v1 release asset
        required: false
        type: boolean
        default: false
  push:
    branches:
      - feat/anime4k-rife-3x
    paths:
      - native/libmpv/**
      - .github/workflows/build-rife-libmpv.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container: docker.io/debian:bookworm-slim
    timeout-minutes: 120

    steps:
      - name: Checkout ReKazumi
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          echo "deb http://deb.debian.org/debian bookworm-backports main" > /etc/apt/sources.list.d/bookworm-backports.list
          apt-get update
          apt-get install -y sudo git gcc-multilib libc-dev make automake pkg-config libtool nasm python3-jsonschema wget python3-jinja2 zip unzip python3-pip ca-certificates cmake ninja-build
          apt-get install -y -t bookworm-backports meson

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          link-to-sdk: true
          ndk-version: r27c

      - name: Checkout pinned libmpv build
        run: |
          git clone https://github.com/Predidit/libmpv-android-video-build.git /tmp/libmpv-build
          git -C /tmp/libmpv-build checkout 045cd0f584769a6ed8967624443045b4a33b122d

      - name: Prepare build scripts
        run: |
          mkdir -p /tmp/libmpv-build/buildscripts/sdk
          ln -s "${ANDROID_HOME}" /tmp/libmpv-build/buildscripts/sdk/android-sdk-linux
          sed -i -e 's/sudo//g' /tmp/libmpv-build/buildscripts/*.sh
          sed -i 's/download-sdk\.sh/download-sdk-debian\.sh/g' /tmp/libmpv-build/buildscripts/download.sh
          sed -i -e '/git reset --hard/d' /tmp/libmpv-build/buildscripts/patch.sh
          chmod +x /tmp/libmpv-build/buildscripts/include/download-sdk-debian.sh
          chmod +x native/libmpv/build_arm64.sh

      - name: Build arm64 RIFE Vulkan bridge
        run: |
          toolchain="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          test -f "$toolchain"
          cmake -S android/app/src/main/cpp -B /tmp/kazumi-rife -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kazumi-rife --parallel

      - name: Build arm64 libmpv with RIFE filter
        run: native/libmpv/build_arm64.sh /tmp/libmpv-build "${GITHUB_WORKSPACE}"

      - name: Upload libmpv artifact
        uses: actions/upload-artifact@v4
        with:
          name: rekazumi-rife-libmpv-arm64
          path: |
            /tmp/libmpv-build/buildscripts/rekazumi-rife-arm64-v8a.jar
            /tmp/kazumi-rife/libkazumi_rife.so
          if-no-files-found: error

      - name: Prepare pinned RIFE 4.25-lite model
        if: inputs.publish_release == true
        run: |
          mkdir -p /tmp/rife-v4.25-lite
          wget -O /tmp/rife-v4.25-lite/flownet.param https://raw.githubusercontent.com/styler00dollar/VapourSynth-RIFE-ncnn-Vulkan/master/models/rife-v4.25-lite_ensembleFalse/flownet.param
          wget -O /tmp/rife-v4.25-lite/flownet.bin https://raw.githubusercontent.com/styler00dollar/VapourSynth-RIFE-ncnn-Vulkan/master/models/rife-v4.25-lite_ensembleFalse/flownet.bin
          echo "f750ec6723f05a800c8fb07ac0bf3537e741b6ff7fe61b3894e407bd10373a63  /tmp/rife-v4.25-lite/flownet.param" | sha256sum -c -
          echo "350a15e464bea5ad378e06c0fb43996e90a0d35653d5a6ef6bc980d832538fb7  /tmp/rife-v4.25-lite/flownet.bin" | sha256sum -c -

      - name: Publish native runtime release
        if: inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rife-runtime-v1
          name: ReKazumi RIFE runtime v1
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            /tmp/libmpv-build/buildscripts/rekazumi-rife-arm64-v8a.jar
            /tmp/rife-v4.25-lite/flownet.param
            /tmp/rife-v4.25-lite/flownet.bin
