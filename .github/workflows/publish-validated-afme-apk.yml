name: Publish validated Adreno AFME APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Validate Adreno AFME Android integration run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download validated APK artifact
        uses: actions/download-artifact@v4
        with:
          name: rekazumi-afme-android-arm64
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename APK
        run: mv dist/app-release.apk dist/ReKazumi-afme-arm64.apk

      - name: Publish validated APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: afme-apk-v1
          name: ReKazumi Adreno AFME APK v1
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist/ReKazumi-afme-arm64.apk
